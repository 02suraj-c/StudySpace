
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySpace | Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <div class="logo">
            <div class="logo-icon">✦</div>
            <div>
                <h1>StudySpace</h1>
                <p>A little progress every day.</p>
            </div>
        </div>
    </header>

    <!-- Statistics -->
    <section class="stats">
        <div class="stat-card">
            <p class="stat-label">Total Tasks</p>
            <div class="stat-number" id="totalTasks">0</div>
        </div>

        <div class="stat-card">
            <p class="stat-label">Completed</p>
            <div class="stat-number" id="completedTasks">0</div>
        </div>

        <div class="stat-card">
            <p class="stat-label">Pending</p>
            <div class="stat-number" id="pendingTasks">0</div>
        </div>

        <div class="stat-card">
            <p class="stat-label">Progress</p>
            <div class="stat-number" id="progressPercent">0%</div>
        </div>
    </section>

    <main class="main-grid">

        <!-- Add Task Form -->
        <section class="card">
            <h2 class="section-title" id="formHeading">Create a task</h2>
            <p class="section-subtitle">
                Make space for what matters today.
            </p>

            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Task title</label>
                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="e.g. Complete Java assignment"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea
                        id="taskDescription"
                        placeholder="Add a few details..."
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="taskDate">Due date</label>
                    <input type="date" id="taskDate" required>
                </div>

                <div class="form-group">
                    <label for="taskPriority">Priority</label>
                    <select id="taskPriority">
                        <option value="Low">Low priority</option>
                        <option value="Medium" selected>Medium priority</option>
                        <option value="High">High priority</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary" id="submitButton">
                    + Add Task
                </button>
            </form>
        </section>

        <!-- Task Dashboard -->
        <section class="card">
            <div class="task-header">
                <div>
                    <h2 class="section-title">My tasks</h2>
                    <p class="section-subtitle">
                        One step at a time.
                    </p>
                </div>

                <button class="btn-secondary" id="clearCompleted">
                    Clear completed
                </button>
            </div>

            <!-- Progress -->
            <div class="progress-container">
                <div class="progress-info">
                    <span>Your daily progress</span>
                    <span id="progressLabel">0% complete</span>
                </div>

                <div
                    class="progress-bar"
                    role="progressbar"
                    aria-label="Task completion progress"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                    id="progressBar"
                >
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <!-- Filters -->
            <div class="filters">
                <select id="statusFilter" aria-label="Filter by status">
                    <option value="All">All tasks</option>
                    <option value="Pending">Pending</option>
                    <option value="Completed">Completed</option>
                </select>

                <select id="priorityFilter" aria-label="Filter by priority">
                    <option value="All">All priorities</option>
                    <option value="High">High priority</option>
                    <option value="Medium">Medium priority</option>
                    <option value="Low">Low priority</option>
                </select>
            </div>

            <!-- Tasks appear here -->
            <div class="task-list" id="taskList">
                <div class="empty-state">
                    <div class="empty-icon">✿</div>
                    <h3>A fresh start!</h3>
                    <p>Add your first task to get started.</p>
                </div>
            </div>
        </section>

    </main>
</div>

<script>
    const taskForm = document.getElementById("taskForm");
    const taskTitle = document.getElementById("taskTitle");
    const taskDescription = document.getElementById("taskDescription");
    const taskDate = document.getElementById("taskDate");
    const taskPriority = document.getElementById("taskPriority");
    const taskList = document.getElementById("taskList");

    const statusFilter = document.getElementById("statusFilter");
    const priorityFilter = document.getElementById("priorityFilter");

    let tasks = [];
    let editingId = null;

    try {
        tasks = JSON.parse(localStorage.getItem("studyspaceTasks")) || [];
        if (!Array.isArray(tasks)) tasks = [];
    } catch {
        tasks = [];
    }

    function saveTasks() {
        localStorage.setItem("studyspaceTasks", JSON.stringify(tasks));
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }

    taskForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const title = taskTitle.value.trim();
        if (!title) return;

        if (editingId !== null) {
            const task = tasks.find(item => item.id === editingId);

            if (task) {
                task.title = title;
                task.description = taskDescription.value.trim();
                task.date = taskDate.value;
                task.priority = taskPriority.value;
            }

            editingId = null;
            document.getElementById("formHeading").textContent = "Create a task";
            document.getElementById("submitButton").textContent = "+ Add Task";
        } else {
            tasks.push({
                id: Date.now(),
                title,
                description: taskDescription.value.trim(),
                date: taskDate.value,
                priority: taskPriority.value,
                completed: false
            });
        }

        saveTasks();
        taskForm.reset();
        taskPriority.value = "Medium";
        renderTasks();
    });

    function renderTasks() {
        const status = statusFilter.value;
        const priority = priorityFilter.value;

        const filteredTasks = tasks.filter(task => {
            const statusMatch =
                status === "All" ||
                (status === "Completed" && task.completed) ||
                (status === "Pending" && !task.completed);

            const priorityMatch =
                priority === "All" || task.priority === priority;

            return statusMatch && priorityMatch;
        });

        if (filteredTasks.length === 0) {
            taskList.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">✿</div>
                    <h3>Nothing here just yet</h3>
                    <p>Try another filter or create a new task.</p>
                </div>`;
        } else {
            taskList.innerHTML = filteredTasks.map(task => {
                const overdue =
                    task.date &&
                    task.date < new Date().toLocaleDateString("en-CA") &&
                    !task.completed;

                return `
                    <article class="task-card ${task.completed ? "completed" : ""}">
                        <div class="task-top">
                            <input
                                type="checkbox"
                                class="task-checkbox"
                                aria-label="Mark ${escapeHTML(task.title)} as completed"
                                data-action="toggle"
                                data-id="${task.id}"
                                ${task.completed ? "checked" : ""}
                            >

                            <div class="task-content">
                                <h3 class="task-title">${escapeHTML(task.title)}</h3>

                                ${task.description
                                    ? `<p class="task-description">${escapeHTML(task.description)}</p>`
                                    : ""}

                                <div class="task-meta">
                                    <span class="priority priority-${task.priority.toLowerCase()}">
                                        ${escapeHTML(task.priority)}
                                    </span>

                                    <span class="status-badge">
                                        ${task.completed ? "Completed" : "In progress"}
                                    </span>

                                    ${task.date
                                        ? `<span class="task-date ${overdue ? "overdue" : ""}">
                                            ${overdue ? "Overdue · " : "Due · "}
                                            ${escapeHTML(task.date)}
                                           </span>`
                                        : ""}
                                </div>
                            </div>
                        </div>

                        <div class="task-actions">
                            <button class="btn-edit"
                                data-action="edit" data-id="${task.id}">
                                Edit
                            </button>

                            <button class="btn-delete"
                                data-action="delete" data-id="${task.id}">
                                Delete
                            </button>
                        </div>
                    </article>`;
            }).join("");
        }

        updateStats();
    }

    function updateStats() {
        const total = tasks.length;
        const completed = tasks.filter(task => task.completed).length;
        const pending = total - completed;
        const percent = total === 0
            ? 0
            : Math.round((completed / total) * 100);

        document.getElementById("totalTasks").textContent = total;
        document.getElementById("completedTasks").textContent = completed;
        document.getElementById("pendingTasks").textContent = pending;
        document.getElementById("progressPercent").textContent = percent + "%";
        document.getElementById("progressLabel").textContent =
            percent + "% complete";

        document.getElementById("progressFill").style.width = percent + "%";

        document.getElementById("progressBar")
            .setAttribute("aria-valuenow", percent);
    }

    taskList.addEventListener("click", function (event) {
        const button = event.target.closest("button[data-action]");
        if (!button) return;

        const id = Number(button.dataset.id);
        const action = button.dataset.action;
        const task = tasks.find(item => item.id === id);

        if (!task) return;

        if (action === "delete") {
            tasks = tasks.filter(item => item.id !== id);
        }

        if (action === "edit") {
            editingId = id;

            taskTitle.value = task.title;
            taskDescription.value = task.description;
            taskDate.value = task.date;
            taskPriority.value = task.priority;

            document.getElementById("formHeading").textContent = "Edit task";
            document.getElementById("submitButton").textContent = "Save Changes";

            taskTitle.focus();
            window.scrollTo({ top: 0, behavior: "smooth" });
            return;
        }

        saveTasks();
        renderTasks();
    });

    taskList.addEventListener("change", function (event) {
        const checkbox = event.target.closest('input[data-action="toggle"]');
        if (!checkbox) return;

        const id = Number(checkbox.dataset.id);
        const task = tasks.find(item => item.id === id);

        if (task) {
            task.completed = checkbox.checked;
            saveTasks();
            renderTasks();
        }
    });

    statusFilter.addEventListener("change", renderTasks);
    priorityFilter.addEventListener("change", renderTasks);

    document.getElementById("clearCompleted").addEventListener("click", function () {
        tasks = tasks.filter(task => !task.completed);
        saveTasks();
        renderTasks();
    });

    renderTasks();
</script>

</body>
</html>
